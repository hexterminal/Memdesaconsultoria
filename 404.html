<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Página não encontrada | Mem de Sá Ratio Consilium</title>
  <link rel="icon" href="assets/images/Logo.png" type="image/png">
  <link rel="stylesheet" href="assets/css/error-page.css">
  <script src="assets/js/error-page.js" defer></script>
</head>
<body>
  <main class="error-page" aria-labelledby="error-title">
    <section class="error-card">
      <p class="brand">Mem de Sá Ratio Consilium</p>
      <p class="error-code" aria-hidden="true">404</p>
      <h1 id="error-title">Página não encontrada</h1>
      <p id="error-message">O endereço pode ter sido alterado ou a página pode ter sido removida.</p>
      <div class="error-actions">
        <a id="home-link" class="button button-primary" href="index.html">Ir para o início</a>
        <a id="contact-link" class="button button-secondary" href="contact.html">Entrar em contato</a>
      </div>
      <label for="error-language" id="language-label">Idioma</label>
      <select id="error-language" aria-labelledby="language-label">
        <option value="pt" selected>Português</option>
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="zh">中文</option>
      </select>
    </section>
  </main>
</body>
</html>
